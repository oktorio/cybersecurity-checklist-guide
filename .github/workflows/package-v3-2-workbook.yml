name: Package v3.2 workbook

on:
  push:
    branches:
      - 'agent/package-v3-2-stable-final'
    paths:
      - '.release/v3_2_ready'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging branch
        uses: actions/checkout@v4
        with:
          ref: agent/package-v3-2-stable-final
          fetch-depth: 0

      - name: Reconstruct and verify workbook
        shell: bash
        run: |
          set -euo pipefail
          cat .release/v3_2_parts/part*.b64 | base64 -d > checklist/Cybersecurity_Checklist_Auditee_v3_2.xlsx
          echo 'cdb5622212cef14dfdb33d17b4557368f20af1a7e7fc19d6c3c41ae72549c63e  checklist/Cybersecurity_Checklist_Auditee_v3_2.xlsx' | sha256sum -c -

      - name: Commit workbook binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checklist/Cybersecurity_Checklist_Auditee_v3_2.xlsx
          if git diff --cached --quiet; then
            echo 'Workbook already packaged.'
          else
            git commit -m 'Add v3.2 workbook binary'
            git push origin HEAD:agent/package-v3-2-stable-final
          fi

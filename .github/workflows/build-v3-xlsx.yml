name: Build v3 Excel workbook

on:
  push:
    branches:
      - agent/upgrade-checklist-v3

permissions:
  contents: write

jobs:
  build-v3-xlsx:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/upgrade-checklist-v3

      - name: Rebuild XLSX from temporary base64 parts
        shell: bash
        run: |
          python - <<'PY'
          import base64, glob
          parts = sorted(glob.glob('checklist/.v3_xlsx_parts/part*.b64'))
          if len(parts) != 8:
              raise SystemExit(f'Expected 8 base64 parts, found {len(parts)}')
          payload = ''.join(open(p, encoding='utf-8').read().strip() for p in parts)
          raw = base64.b64decode(payload, validate=True)
          target = 'checklist/Cybersecurity_Checklist_Auditee_v3.xlsx'
          with open(target, 'wb') as f:
              f.write(raw)
          print(f'Wrote {target}: {len(raw)} bytes')
          PY

      - name: Commit generated workbook
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checklist/Cybersecurity_Checklist_Auditee_v3.xlsx
          if git diff --cached --quiet; then
            echo "Workbook unchanged."
            exit 0
          fi
          git commit -m "Build v3 Excel workbook"
          git push

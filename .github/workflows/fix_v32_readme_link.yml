name: Fix v3.2 README download link

on:
  push:
    branches:
      - agent/fix-v3-2-checklist-files
    paths:
      - '.release/fix_v32_readme_link.txt'

permissions:
  contents: write

jobs:
  fix-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-v3-2-checklist-files
          fetch-depth: 0
      - name: Use direct-download link for Excel checklist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          old = '(checklist/Cybersecurity_Checklist_Auditee_v3_2.xlsx)'
          new = '(https://raw.githubusercontent.com/oktorio/cybersecurity-checklist-guide/master/checklist/Cybersecurity_Checklist_Auditee_v3_2.xlsx)'
          if old not in text:
              raise SystemExit('Expected v3.2 Excel README link was not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit README fix and clean helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .release/fix_v32_readme_link.txt
          rm -f .github/workflows/fix_v32_readme_link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use direct download link for v3.2 checklist"
          git push origin HEAD:agent/fix-v3-2-checklist-files

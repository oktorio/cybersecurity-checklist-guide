name: Package v3.2 workbook from verified blobs

on:
  push:
    branches:
      - agent/fix-v3-2-checklist-files
    paths:
      - '.release/v32_trigger.txt'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-v3-2-checklist-files
          fetch-depth: 0
      - name: Reconstruct and verify workbook
        shell: bash
        run: |
          set -euo pipefail
          cat .release/v32xz/part01.b64 .release/v32xz/part02.b64 .release/v32xz/part03.b64 .release/v32xz/part04.b64 .release/v32xz/part05a.b64 .release/v32xz/part05b.b64 .release/v32xz/part06a.b64 > /tmp/v32.all.b64
          for sha in \
            f199e6756524329afae144a8041d55171505a9ad \
            644765bfb0458f68e310ae430a6d3e8d050c883c \
            a428e880b2684882a0a94b62c18ac333989528cf \
            36b52514bb62ec8b9da5e02d5af64c48e54ff436 \
            0d616a14afc16bc47a9fda62421b4b40f879753f \
            2b9f4671075452396f750535530cc7bc0bc741b7; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content | tr -d '\n' | base64 -d >> /tmp/v32.all.b64
          done
          tr -d '\n\r ' < /tmp/v32.all.b64 | base64 -d > /tmp/v32.xlsx.xz
          echo "79aade4582da556c0a107fd7880b54680ae024b855e8132f173b162da15ed6cf  /tmp/v32.xlsx.xz" | sha256sum -c -
          xz -dc /tmp/v32.xlsx.xz > checklist/Cybersecurity_Checklist_Auditee_v3_2.xlsx
          test "$(stat -c%s checklist/Cybersecurity_Checklist_Auditee_v3_2.xlsx)" = "178836"
          echo "cdb5622212cef14dfdb33d17b4557368f20af1a7e7fc19d6c3c41ae72549c63e  checklist/Cybersecurity_Checklist_Auditee_v3_2.xlsx" | sha256sum -c -
      - name: Commit verified workbook and clean temporary packaging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release/v32xz .release/v32json
          rm -f .release/v32_trigger.txt
          rm -f .github/workflows/package_v32.yml .github/workflows/package_v32_blob.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add verified v3.2 checklist workbook"
          git push origin HEAD:agent/fix-v3-2-checklist-files
